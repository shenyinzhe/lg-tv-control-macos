name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: xcrun swiftc -swift-version 5 -typecheck -framework AppKit -framework Carbon app/main.swift
      - run: bash -n scripts/*.sh
